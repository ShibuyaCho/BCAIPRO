name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          cd salesedge
          npm install

      - name: Build app
        run: |
          cd salesedge
          npm run build

      - name: Deploy
        uses: actions/deploy-pages@v4
